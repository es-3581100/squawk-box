name: CI

on:
  push:
    branches: ["main", "verify/v0.1"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo replay/render
        run: python examples/schema_retry_demo.py
      - name: Compile all Python
        run: python -m compileall -q squawk_box tests examples
      - name: Validate JSON schema files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path("schemas").glob("*.json")):
              json.loads(p.read_text(encoding="utf-8"))
              print("OK", p)
          PY
